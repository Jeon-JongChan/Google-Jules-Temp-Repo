<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="veo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with Android adaptive rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Central Gemini 4-Point Star + Multimodal Rings (Music note, Video reel, Image sparkle) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Rotating aura rings -->
    <circle r="150" fill="none" stroke="url(#gemini)" stroke-width="6" stroke-dasharray="24 16" opacity="0.6"/>
    <circle r="110" fill="none" stroke="url(#veo)" stroke-width="4" stroke-dasharray="12 12" opacity="0.5"/>
    
    <!-- Gemini Core Sparkle -->
    <path d="M 0,-120 C 10,-40 40,-10 120,0 C 40,10 10,40 0,120 C -10,40 -40,10 -120,0 C -40,-10 -10,-40 0,-120 Z" fill="url(#gemini)"/>
    
    <!-- Mini icons around core: Music, Video, Image -->
    <!-- Top-Right: Music Note -->
    <path d="M 60,-75 L 85,-85 L 85,-45 A 12,12 0 1,1 70,-48 L 70,-73 L 60,-70 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Bottom-Right: Video Play -->
    <polygon points="65,55 90,70 65,85" fill="#ffffff" opacity="0.9"/>
    <!-- Bottom-Left: Image Frame Sparkle -->
    <path d="M -75,60 C -72,68 -68,72 -60,75 C -68,78 -72,82 -75,90 C -78,82 -82,78 -90,75 C -82,72 -78,68 -75,60 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
